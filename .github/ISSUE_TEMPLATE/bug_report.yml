name: 缺陷报告
description: 程序行为与预期不符
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 Issue。涉及文件误移动、越权访问、安装脚本行为的问题属于安全问题，
        请走 [安全策略](https://github.com/Aojiaojiejie/xingyue-desktop/blob/main/SECURITY.md) 的私密通道，不要在此公开。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 程序「关于」中的版本，或 config/app_manifest.json 里的 version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 系统
      options:
        - Windows 11
        - Windows 10
        - 其他（请在复现步骤中说明）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动程序
        2. 点击「快照当前桌面」
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有截图可直接粘贴
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: "%APPDATA%\\XingYueDesktop\\logs 下当日文件的内容。粘贴前请删掉包含个人信息的文件路径。"
      render: text
    validations:
      required: false
